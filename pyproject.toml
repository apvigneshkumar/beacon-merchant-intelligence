[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-merchant-intelligence"
version = "0.1.0"
description = "Deterministic core for a public storefront intelligence prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
beacon-demo = "beacon_merchant_intelligence.demo:main"
beacon-collect = "beacon_merchant_intelligence.cli:main"
beacon-collect-sporting-feet = "beacon_merchant_intelligence.sporting_feet_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
